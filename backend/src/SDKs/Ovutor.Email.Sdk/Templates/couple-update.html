<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="x-apple-disable-message-reformatting" />
  <title>An update from your planner</title>
  <!--[if !mso]><!-->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" />
  <!--<![endif]-->
  <style>
    body { margin: 0; padding: 0; background: #FAF9F8; color: #1E1E1E; font-family: 'Inter', Arial, sans-serif; -webkit-text-size-adjust: 100%; }
    table { border-collapse: collapse; }
    a { color: inherit; }
    .page { width: 100%; padding: 40px 20px 48px; }
    .email { width: 100%; max-width: 560px; margin: 0 auto; background: #FFFFFF; border: 1px solid #e6e2dc; }
    .bar { height: 4px; background: #C1281B; }
    .email-header { padding: 32px 40px 0; }
    .brand { font-family: 'Playfair Display', Georgia, serif; font-size: 22px; color: #1E1E1E; }
    .brand span { color: #C1281B; }
    .eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #C1281B; margin: 24px 0 6px; }
    .content { padding: 8px 40px 12px; }
    h1 { margin: 0 0 18px; font-family: 'Playfair Display', Georgia, serif; font-weight: 500; font-size: 28px; line-height: 1.15; color: #1E1E1E; }
    p { margin: 0 0 16px; font-size: 15px; line-height: 1.65; color: #333; }
    .message-block { background: #FAF9F8; border-left: 3px solid #C1281B; padding: 16px 20px; margin: 0 0 24px; font-size: 15px; line-height: 1.6; color: #1E1E1E; }
    .button { display: inline-block; padding: 14px 26px; background: #C1281B; color: #FFFFFF !important; text-decoration: none; font-weight: 700; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; margin: 4px 0 8px; }
    .footer { padding: 24px 40px 32px; text-align: center; }
    .footer p { margin: 0; color: #918b86; font-size: 11px; line-height: 1.6; }
  </style>
</head>
<body>
  <main class="page">
    <div class="email">
      <div class="bar"></div>
      <div class="email-header">
        <div class="brand">{{brand_name}} <span>&#9825;</span></div>
      </div>
      <div class="content">
        <p class="eyebrow">An update on your wedding</p>
        <h1>Hi {{couple_names}},</h1>
        <p>{{planner_name}} just shared an update on your planning workspace:</p>
        <div class="message-block">{{message}}</div>
        <a href="{{portal_url}}" class="button">Open your portal</a>
      </div>
      <div class="footer">
        <p>You're receiving this because you have an active wedding workspace with Ovutor.</p>
      </div>
    </div>
  </main>
</body>
</html>
