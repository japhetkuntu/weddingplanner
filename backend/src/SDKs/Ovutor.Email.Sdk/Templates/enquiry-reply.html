<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A reply from Ovutor</title>
  <style>
    body { margin: 0; padding: 0; background: #FAF9F8; color: #1E1E1E; font-family: Arial, sans-serif; }
    .page { width: 100%; padding: 40px 20px 48px; }
    .email { width: 100%; max-width: 560px; margin: 0 auto; background: #FFFFFF; border: 1px solid #e6e2dc; }
    .bar { height: 4px; background: #FEB326; }
    .content { padding: 32px 40px 8px; }
    .brand { font-family: Georgia, serif; font-size: 24px; color: #1E1E1E; margin-bottom: 24px; }
    p { margin: 0 0 16px; font-size: 15px; line-height: 1.65; color: #333; }
    .message { white-space: pre-line; font-size: 15px; line-height: 1.7; color: #1E1E1E; margin: 0 0 24px; }
    .footer { padding: 16px 40px 32px; }
    .footer p { margin: 0; color: #918b86; font-size: 11px; line-height: 1.6; }
  </style>
</head>
<body>
  <main class="page">
    <div class="email">
      <div class="bar"></div>
      <div class="content">
        <div class="brand">{{brand_name}}</div>
        <p>Hi {{recipient_name}},</p>
        <div class="message">{{message}}</div>
        <p>Warm regards,<br />{{sender_name}}<br />{{brand_name}}</p>
      </div>
      <div class="footer">
        <p>You're receiving this because you sent us an enquiry through our website. Simply reply to this email to continue the conversation.</p>
      </div>
    </div>
  </main>
</body>
</html>
