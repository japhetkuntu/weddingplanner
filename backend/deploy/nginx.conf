# Template installed at /etc/nginx/sites-available/ovutor by install.sh, which
# substitutes __CLIENT_API_DOMAIN__ / __ADMIN_API_DOMAIN__ / __ADMIN_PORTAL_DOMAIN__ /
# __CLIENT_PORTAL_DOMAIN__ / __WEDDING_WEBSITE_DOMAIN__ for the real domains you
# provide. This starts out as plain HTTP — run certbot afterwards (see DEPLOY.md) to
# get HTTPS; certbot's nginx plugin edits this file in place to add the `listen 443
# ssl` blocks, certificate paths, and the http->https redirect, so seeing this file
# change after that is expected, not a mistake.

server {
	listen 80;
	listen [::]:80;
	server_name __CLIENT_API_DOMAIN__;

	location / {
		proxy_pass http://127.0.0.1:5000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	gzip on;
	gzip_types application/json;
}

server {
	listen 80;
	listen [::]:80;
	server_name __ADMIN_API_DOMAIN__;

	# Nginx defaults to 1MB — the admin API accepts document/photo uploads up to
	# 25MB (see the upload UI copy in admin-portal's Documents/Website editor
	# pages), so without this every real upload gets rejected here with a 413
	# before it ever reaches the app. Headroom above 25MB covers multipart/form-data
	# boundary overhead.
	client_max_body_size 30M;

	location / {
		proxy_pass http://127.0.0.1:5001;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	gzip on;
	gzip_types application/json;
}

# ---------------------------------------------------------------------------
# Frontends — all three are static Vite builds (no Node process to proxy to,
# unlike the APIs above), served directly by Nginx from /var/www/ovutor/<app>.
# `deploy.sh` publishes each app's `dist/` there on every deploy; Nginx just
# needs `try_files` SPA fallback so client-side routing (React Router, and the
# wedding-website's own /<slug> path-based tenant routing) works on a hard
# refresh or direct link instead of 404ing on anything but `/`.
# ---------------------------------------------------------------------------

server {
	listen 80;
	listen [::]:80;
	server_name __ADMIN_PORTAL_DOMAIN__;
	root /var/www/ovutor/admin-portal;
	index index.html;

	location / {
		try_files $uri $uri/ /index.html;
	}

	# Vite content-hashes everything under /assets/, so a given filename's content
	# never changes — safe to cache for a year. `index.html` references the current
	# hashed filenames, so it must never be cached this way, or a deploy wouldn't
	# reach visitors with an already-cached index.html until it expired on its own.
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
	}
	location = /index.html {
		add_header Cache-Control "no-cache";
	}

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;
}

server {
	listen 80;
	listen [::]:80;
	server_name __CLIENT_PORTAL_DOMAIN__;
	root /var/www/ovutor/client-portal;
	index index.html;

	location / {
		try_files $uri $uri/ /index.html;
	}

	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
	}
	location = /index.html {
		add_header Cache-Control "no-cache";
	}

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;
}

server {
	listen 80;
	listen [::]:80;
	# Bare apex + www — every couple's site is a *path* on this one domain
	# (ovutor.com/<slug>), not a subdomain, so there's no wildcard here.
	server_name __WEDDING_WEBSITE_DOMAIN__ www.__WEDDING_WEBSITE_DOMAIN__;
	root /var/www/ovutor/wedding-website;
	index index.html;

	location / {
		try_files $uri $uri/ /index.html;
	}

	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
	}
	location = /index.html {
		add_header Cache-Control "no-cache";
	}

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;
}
